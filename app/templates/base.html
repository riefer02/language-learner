<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korean Language Learner{% block title %}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <nav aria-label="Main navigation">
      <div class="nav-container">
        <h1 aria-label="Kiku, Korean language learner">Kiku</h1>
        <ul>
          <li>
            <a
              href="{{ url_for('learn.today') }}"
              aria-current="{{ 'page' if request.endpoint in ['learn.today', 'learn.review', 'learn.progress'] else 'false' }}"
              >Learn</a
            >
          </li>
          <li>
            <a
              href="{{ url_for('learn.scenes') }}"
              aria-current="{{ 'page' if request.path.startswith('/learn/scenes') else 'false' }}"
              >Scenes</a
            >
          </li>
          <li>
            <a
              href="{{ url_for('learn.hangul') }}"
              aria-current="{{ 'page' if request.path.startswith('/learn/hangul') else 'false' }}"
              >Hangul</a
            >
          </li>
          <li>
            <a
              href="{{ url_for('learn.progress') }}"
              aria-current="{{ 'page' if request.endpoint == 'learn.progress' else 'false' }}"
              >Progress</a
            >
          </li>
          <li>
            <a
              href="{{ url_for('main.resources') }}"
              aria-current="{{ 'page' if request.endpoint == 'main.resources' else 'false' }}"
              >Resources</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <main class="container" id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
